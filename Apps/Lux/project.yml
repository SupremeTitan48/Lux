# XcodeGen project for the Lux apps. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate --spec Apps/Lux/project.yml
# The generated Lux.xcodeproj is not committed.
name: Lux
options:
  bundleIdPrefix: org.lux
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
    visionOS: "1.0"
  createIntermediateGroups: true
packages:
  LuxCore:
    path: ../../Packages/LuxCore
  LuxDesignSystem:
    path: ../../Packages/LuxDesignSystem
  BCP1662:
    path: ../../Traditions/BCP1662
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Lux:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: LuxCore
      - package: LuxDesignSystem
      - package: BCP1662
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lux.Lux
        INFOPLIST_KEY_CFBundleDisplayName: Lux
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2,7"
        ENABLE_HARDENED_RUNTIME: YES
  LuxWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
        excludes: [LibraryView.swift, SettingsView.swift, CalendarView.swift]
    dependencies:
      - package: LuxCore
      - package: LuxDesignSystem
      - package: BCP1662
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lux.Lux.watch
        INFOPLIST_KEY_CFBundleDisplayName: Lux
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
